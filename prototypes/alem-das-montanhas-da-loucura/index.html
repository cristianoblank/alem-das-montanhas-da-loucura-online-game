  .loja .remover .rem { width: 120px; height: 150px; border: 2px dashed #c9a24a; border-radius: 8px; display: flex; align-items: center; justify-content: center; text-align: center; font: 700 16px var(--titulo); }
  .loja .remover.usado { opacity: .3; pointer-events: none; }
  .loja-rod { display: flex; justify-content: space-between; align-items: center; margin-top: 10px; }
  .transf { display: flex; gap: 8px; }
  /* fim */
  .fim { display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; gap: 18px; background: radial-gradient(#2a1018, #000); }
  .fim.vit { background: radial-gradient(#2c3a3c, #000); }
  .fim h1 { font: 700 70px var(--deco); color: #efd9a0; }
  .fim .epilogo { max-width: 900px; font: italic 23px/1.45 var(--fell); color: #e8dcc2; }
  .fim .resumo { font-size: 17px; color: #cbbfa6; }
  /* figuras */
  .figuras { padding: 10px; overflow: hidden; } .figuras h2 { color: #efd9a0; }
  .fig-grade { display: flex; flex-wrap: wrap; gap: 6px; }
  .fig { width: 100px; text-align: center; } .fig-n { font: 700 10px var(--titulo); color: #efd9a0; height: 24px; }
  /* números flutuantes */
  #flut { position: absolute; inset: 0; pointer-events: none; z-index: 90; }
  .flut { position: absolute; transform: translate(-50%, -50%); font: 900 30px var(--titulo); text-shadow: 0 2px 4px #000, 0 0 10px #000; white-space: nowrap; }
</style>
</head>
<body>
<div id="palco"></div>
<script src="config.js"></script>
<script src="material/dados.js"></script>
<script src="material/imagens.js"></script>
<script src="material/imagens_ia.js"></script>
<script src="material/comum.js"></script>
<script src="material/mapa.js"></script>
<script src="js/textos.js"></script>
<script src="js/motor.js"></script>
<script src="js/combate.js"></script>
<script src="js/cartas.js"></script>
<script src="js/itens.js"></script>
<script src="js/nos.js"></script>
<script>
'use strict';
// ---- Ganchos da verificação (do starter): passo fixo, relógio, window.game, cenas play e figures ----
const params = new URLSearchParams(location.search);
const tune = new Proxy({}, { get: (_, k) => CONFIG[k].value });
const STEP = 1 / 60;
const W = 1600, H = 900;
const clock = window.GAME_CLOCK || { now: () => performance.now() / 1000 };
const events = [];
const palco = document.getElementById('palco');
function fit() {
  const k = Math.min(innerWidth / W, innerHeight / H);
  palco.style.transform = `scale(${k})`;
  palco.style.left = Math.max(0, (innerWidth - W * k) / 2) + 'px';
  palco.style.top = Math.max(0, (innerHeight - H * k) / 2) + 'px';
}
addEventListener('resize', fit); fit();
// ---- Entrada: teclas por posição (event.code) ----
const hit = new Set(), down = new Set();
addEventListener('keydown', e => {
  startAudio();
  if (!e.repeat) hit.add(e.code);
  down.add(e.code);
  if (['Space', 'Tab', 'ArrowLeft', 'ArrowRight', 'ArrowUp', 'ArrowDown'].includes(e.code)) e.preventDefault();
});
addEventListener('keyup', e => down.delete(e.code));
addEventListener('blur', () => down.clear());
// ---- Som: começa no primeiro gesto, M liga e desliga ----
let audio = null, muted = false;
function startAudio() {
  try {
    if (!audio) { const ac = window.GAME_AUDIO || new (window.AudioContext || window.webkitAudioContext)(); const out = ac.createGain(); out.gain.value = muted ? 0 : tune.volume; out.connect(ac.destination); audio = { ac, out }; }
    if (audio.ac.state === 'suspended') audio.ac.resume();
  } catch (e) { }
}
addEventListener('pointerdown', () => startAudio());
function setMuted(m) { muted = m; if (audio) audio.out.gain.value = m ? 0 : tune.volume; }
addEventListener('tune', () => setMuted(muted));
function tone(freq, dur, type = 'square', vol = 0.3) {
  if (!audio || muted) return;
  const t = audio.ac.currentTime, o = audio.ac.createOscillator(), g = audio.ac.createGain();
  o.type = type; o.frequency.value = freq; g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.001, t + dur);
  o.connect(g).connect(audio.out); o.start(t); o.stop(t + dur);
}
</script>
<script src="js/ui.js"></script>
<script>
'use strict';
// cena: title (título e preparação), play (expedição), over (derrota), results (vitória), figures (todos os inimigos)
function cena() {
  if (UI.ui.figuras) return 'figures';
  if (UI.ui.fim) return UI.ui.fim.vitoria ? 'results' : 'over';
  if (UI.ui.motor) return 'play';
  return 'title';
}
function step() {
  if (hit.has('KeyM')) setMuted(!muted);
  UI.ui.rapido = UI.ui.rapido || false;
  UI.ui.segurandoEspaco = down.has('Space');
  for (const k of hit) UI.tecla(k);
  hit.clear();
  const rap = UI.ui.rapido; if (UI.ui.segurandoEspaco) UI.ui.rapido = true;
  UI.passo();
  if (UI.ui.segurandoEspaco) UI.ui.rapido = rap;
}
let last, acc = 0;
function tick() {
  const now = clock.now();
  acc += Math.min(now - last, 0.25); last = now;
  while (acc >= STEP) { step(); acc -= STEP; }
  UI.desenhar();
}
function frame() { tick(); requestAnimationFrame(frame); }
function timer() { if (document.visibilityState === 'visible' && clock.now() - last > 0.1) tick(); }
window.game = {
  get scene() { return cena(); },
  get state() { const m = UI.ui.motor; return m && m.s ? m.s : { tela: UI.ui.tela }; },
  press(code) { hit.add(code); },
  hold(code, on) { on ? down.add(code) : down.delete(code); },
  get events() { return events; },
  step(n = 1, draw = true) { for (let i = 0; i < n; i++) step(); if (draw) UI.desenhar(); },
};
if (params.get('scene') === 'figures') UI.ui.figuras = true;
else if (params.get('scene') === 'play') { UI.ui.autoPrimeiro = true; UI.iniciar({ inv: ['veterano', 'ocultista'], mapas: { 1: 'A', 2: 'A', 3: 'A' }, loucura: 0, variantes: {}, semente: (Number(params.get('seed')) || CONFIG.seed) >>> 0 }); }
last = clock.now();
UI.desenhar();
if (params.get('manual') === '1') UI.desenhar();
else { requestAnimationFrame(frame); setInterval(timer, 50); }
</script>
</body>
